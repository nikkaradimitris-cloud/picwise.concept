# The checks' round started by hand, when the server was down while it ran (owner, 2026-11-25,
# the server not answering from about 08:52 to 09:47 UTC: the round of the night of 26/11,
# started 05:30 UTC by its timer, was stopped by the outage, and the timer starts the next only
# on 26/11 05:30, after the night is due at 03:05). It starts picwise-checks.service as the
# timer and deploy.sh do (`--no-block`): the bot asks nothing between 03:05 and 05:30 UTC and
# nothing on a night recorded already, and goes on from the answers it kept. It starts nothing
# when the round is running. Runs when this file is pushed to the work branch; to start it
# again, change the "Run:" line and push that commit (only on the owner's word).
# Run: 2026-11-25, the round stopped by the outage
# The repository is public and so is this log: the server's names are masked, and the bot's
# lines are shown as server-health.yml shows them (counts and shop names, no address).
name: Server checks' round, started by hand
on:
  push:
    branches: [ccr-4f47068a-99ikwe]
    paths:
      - '.github/workflows/server-checks-start.yml'
permissions:
  contents: read
concurrency:
  group: server-setup
  cancel-in-progress: false
jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Connect with the key, check the server's identity, mask its names
        id: connect
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          # A key pasted on Windows may carry carriage returns, which ssh refuses.
          printf '%s\n' "$SERVER_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # As server-deploy.yml: the server must show a login the host key pinned in
          # .github/server-host-key.pin, and every connection below accepts that key only.
          seen="$RUNNER_TEMP/seen"
          : > "$seen"
          ssh -F /dev/null -o BatchMode=yes -o ConnectTimeout=15 -o HostKeyAlgorithms=ssh-ed25519 \
            -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$seen" -o GlobalKnownHostsFile=/dev/null \
            -o PubkeyAuthentication=no -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no \
            -o HostbasedAuthentication=no -o GSSAPIAuthentication=no -o LogLevel=QUIET \
            "ubuntu@$SERVER_HOST" true 2>/dev/null || true
          host_key=$(awk 'NF >= 3 {print $2, $3; exit}' "$seen")
          rm -f "$seen"
          [ -n "$host_key" ] || { echo "the server showed a login no host key"; exit 1; }
          pin=$(HOST_KEY="$host_key" python3 .github/scripts/host_key_pin.py)
          expected=$( (grep -v '^#' .github/server-host-key.pin || true) | tr -d '[:space:]')
          if [ "$pin" != "$expected" ]; then
            echo "the server does NOT match the pin (reinstalled, or not our server); its pin: $pin"
            exit 1
          fi
          echo "the server matches the pin"
          echo "picwise-server $host_key" > ~/.ssh/known_hosts_picwise
          cat > ~/.ssh/config <<EOF
          Host picwise
            HostName $SERVER_HOST
            HostKeyAlias picwise-server
            UserKnownHostsFile ~/.ssh/known_hosts_picwise
            StrictHostKeyChecking yes
            User ubuntu
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 8
            LogLevel ERROR
          EOF
          chmod 600 ~/.ssh/config
          # The host name resolves to the address, so it is masked like the address.
          names=$(ssh -n picwise 'hostname; hostname -f; hostname -I')
          for name in $names; do echo "::add-mask::$name"; done
          echo "connected"
      - name: Start the round, unless it runs
        if: steps.connect.outcome == 'success'
        run: |
          ssh -n picwise 'state=$(systemctl show picwise-checks.service -p ActiveState --value); \
            if [ "$state" = active ] || [ "$state" = activating ]; then echo "the round runs already: nothing started"; \
            else sudo systemctl start --no-block picwise-checks.service && echo "the round started"; fi'
      - name: The round, a minute later
        if: steps.connect.outcome == 'success'
        run: |
          sleep 60
          ssh -n picwise 'sudo systemctl show picwise-checks.service -p ActiveState -p SubState -p Result \
              -p ExecMainStartTimestamp; date -u "+now %Y-%m-%d %H:%M:%S UTC"; \
            sudo journalctl -u picwise-checks.service --since "-3 min" -o "short-iso" --no-pager \
              | grep -v -E "https?://|[a-z0-9-]+\.(co\.uk|com|net|org|uk)\b" | tail -n 20' || true
      - name: Remove the key from the runner
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/config
