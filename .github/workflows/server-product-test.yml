# One look at whether a shop the nightly bot never asks answers for its products one at a
# time (owner, 2026-11-21, of InStock UK, never asked by the bot since 26/10: «Πρώτα δοκιμή
# σε λίγα»). The work is deployment/bot/shop_product_test.py, run on the server, as the
# site's user and from the server's own address, with the release in use: its robots.txt,
# its catalogue's first page, then a few of its products, one request at a time, a few
# seconds apart, only what robots.txt allows; never an Awin link. It changes nothing on
# the server.
#
# On a push of its own branch that changes the script or this file, or by hand. The
# repository is public and so is this log: the server's names and addresses are masked;
# the script prints the shop's host and counts, never an address or a product's name.
name: Server product test (read-only)
on:
  push:
    branches: [claude/product-test-2026-11-21]
    paths:
      - '.github/workflows/server-product-test.yml'
      - 'deployment/bot/shop_product_test.py'
  workflow_dispatch:
    inputs:
      shop:
        description: "The shop, as the feed names it"
        default: "InStock UK"
      sample:
        description: "How many of its products"
        default: "12"
permissions:
  contents: read
# Shared with server-setup.yml and server-deploy.yml: never while the server is set up or
# a release deployed.
concurrency:
  group: server-setup
  cancel-in-progress: false
jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Connect with the key, check the server's identity, mask its names
        id: connect
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          # A key pasted on Windows may carry carriage returns, which ssh refuses.
          printf '%s\n' "$SERVER_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # As server-deploy.yml: the server must show a login the host key pinned in
          # .github/server-host-key.pin, and every connection below accepts that key only.
          seen="$RUNNER_TEMP/seen"
          : > "$seen"
          ssh -F /dev/null -o BatchMode=yes -o ConnectTimeout=15 -o HostKeyAlgorithms=ssh-ed25519 \
            -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$seen" -o GlobalKnownHostsFile=/dev/null \
            -o PubkeyAuthentication=no -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no \
            -o HostbasedAuthentication=no -o GSSAPIAuthentication=no -o LogLevel=QUIET \
            "ubuntu@$SERVER_HOST" true 2>/dev/null || true
          host_key=$(awk 'NF >= 3 {print $2, $3; exit}' "$seen")
          rm -f "$seen"
          [ -n "$host_key" ] || { echo "the server showed a login no host key"; exit 1; }
          pin=$(HOST_KEY="$host_key" python3 .github/scripts/host_key_pin.py)
          expected=$( (grep -v '^#' .github/server-host-key.pin || true) | tr -d '[:space:]')
          if [ "$pin" != "$expected" ]; then
            echo "the server does NOT match the pin (reinstalled, or not our server); its pin: $pin"
            exit 1
          fi
          echo "the server matches the pin"
          echo "picwise-server $host_key" > ~/.ssh/known_hosts_picwise
          cat > ~/.ssh/config <<EOF
          Host picwise
            HostName $SERVER_HOST
            HostKeyAlias picwise-server
            UserKnownHostsFile ~/.ssh/known_hosts_picwise
            StrictHostKeyChecking yes
            User ubuntu
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 8
            LogLevel ERROR
          EOF
          chmod 600 ~/.ssh/config
          # The host name resolves to the address, so it is masked like the address.
          names=$(ssh -n picwise 'hostname; hostname -f; hostname -I')
          for name in $names; do echo "::add-mask::$name"; done
          echo "connected"
      - name: Ask a few of the shop's products, once
        if: steps.connect.outcome == 'success'
        env:
          SHOP: ${{ inputs.shop || 'InStock UK' }}
          SAMPLE: ${{ inputs.sample || '12' }}
        run: |
          case "$SHOP" in
            *[!A-Za-z0-9\ \&.-]*|'') echo "a shop's name of letters, digits, spaces, '&', '.' and '-' only"; exit 1 ;;
          esac
          case "$SAMPLE" in
            *[!0-9]*|'') echo "a number of products"; exit 1 ;;
          esac
          [ "$SAMPLE" -ge 1 ] && [ "$SAMPLE" -le 30 ] || { echo "1 to 30 products"; exit 1; }
          # The script from stdin, in a unit of its own with its own limits; the site's code
          # (the release in use) on its path, and the feed's copies the preparation
          # downloaded, so no key is needed.
          ssh picwise "sudo systemd-run --quiet --wait --pipe --collect \
            -p User=picwise -p Group=picwise -p WorkingDirectory=/srv/picwise/current \
            -p Environment=PYTHONPATH=/srv/picwise/current/src -p Environment=PYTHONDONTWRITEBYTECODE=1 \
            -p Nice=10 -p MemoryHigh=2G -p MemoryMax=3G -p RuntimeMaxSec=20min \
            -p NoNewPrivileges=yes -p ProtectSystem=strict -p ProtectHome=yes -p PrivateTmp=yes \
            /usr/bin/python3 - --shop '$SHOP' --sample '$SAMPLE'" < deployment/bot/shop_product_test.py
      - name: Remove the key from the runner
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/config
