# A look at the checks' bot on the server before the «ανέβασε» of the checks (the checks'
# rules, docs/PICWISE_CHECKS_RULES.md; task 5 builds them, task 7 looks): the bot of this
# commit (deployment/bot/shop_checks_bot.py and src/picwise_checks, bundled into one file by
# .github/scripts/bundle_checks.py, since the release in use does not carry them) run on the
# server as the site's user with the release's own code, in its look mode: at most a few
# products a shop, for a few minutes, nothing written (--dry; the unit can write nowhere
# under /srv either). Each shop asked as the checks ask it: its own address only, its
# robots.txt first, 3 s apart, never an Awin link; Awin's programmes from its API.
#
# On a push of its own branch that changes the bot, the checks' package, the bundler or this
# file. The repository is public and so is this log: the server's names are masked; the bot
# prints counts and shop names only, never an address, an id or a key.
#
# Run: 2026-11-22 00:50 Athens (task 5, Awin's names matched), 10 a shop (to run again, change this line and push).
name: Server look at the checks (read-only)
on:
  push:
    branches: [claude/checks-look]
    paths:
      - '.github/workflows/server-checks-look.yml'
      - '.github/scripts/bundle_checks.py'
      - 'deployment/bot/shop_checks_bot.py'
      - 'src/picwise_checks/**'
permissions:
  contents: read
# Shared with server-setup.yml and server-deploy.yml: never while the server is set up or
# a release deployed.
concurrency:
  group: server-setup
  cancel-in-progress: false
jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Connect with the key, check the server's identity, mask its names
        id: connect
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          # A key pasted on Windows may carry carriage returns, which ssh refuses.
          printf '%s\n' "$SERVER_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # As server-deploy.yml: the server must show a login the host key pinned in
          # .github/server-host-key.pin, and every connection below accepts that key only.
          seen="$RUNNER_TEMP/seen"
          : > "$seen"
          ssh -F /dev/null -o BatchMode=yes -o ConnectTimeout=15 -o HostKeyAlgorithms=ssh-ed25519 \
            -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$seen" -o GlobalKnownHostsFile=/dev/null \
            -o PubkeyAuthentication=no -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no \
            -o HostbasedAuthentication=no -o GSSAPIAuthentication=no -o LogLevel=QUIET \
            "ubuntu@$SERVER_HOST" true 2>/dev/null || true
          host_key=$(awk 'NF >= 3 {print $2, $3; exit}' "$seen")
          rm -f "$seen"
          [ -n "$host_key" ] || { echo "the server showed a login no host key"; exit 1; }
          pin=$(HOST_KEY="$host_key" python3 .github/scripts/host_key_pin.py)
          expected=$( (grep -v '^#' .github/server-host-key.pin || true) | tr -d '[:space:]')
          if [ "$pin" != "$expected" ]; then
            echo "the server does NOT match the pin (reinstalled, or not our server); its pin: $pin"
            exit 1
          fi
          echo "the server matches the pin"
          echo "picwise-server $host_key" > ~/.ssh/known_hosts_picwise
          cat > ~/.ssh/config <<EOF
          Host picwise
            HostName $SERVER_HOST
            HostKeyAlias picwise-server
            UserKnownHostsFile ~/.ssh/known_hosts_picwise
            StrictHostKeyChecking yes
            User ubuntu
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 8
            LogLevel ERROR
          EOF
          chmod 600 ~/.ssh/config
          # The host name resolves to the address, so it is masked like the address.
          names=$(ssh -n picwise 'hostname; hostname -f; hostname -I')
          for name in $names; do echo "::add-mask::$name"; done
          echo "connected"
      - name: Run the checks' bot in its look mode, once
        if: steps.connect.outcome == 'success'
        run: |
          python3 .github/scripts/bundle_checks.py --dry --sample 10 --minutes 20 > "$RUNNER_TEMP/checks_bundle.py"
          # In a unit of its own with its own limits: the prepared catalogue read once beside
          # the site (about 2 GB), the release's code on its path, Awin's token from the
          # server's secrets for its programmes (never printed), nothing writable under /srv.
          ssh picwise "sudo systemd-run --quiet --wait --pipe --collect \
            -p User=picwise -p Group=picwise -p WorkingDirectory=/srv/picwise/current \
            -p Environment=PYTHONPATH=/srv/picwise/current/src -p Environment=PYTHONDONTWRITEBYTECODE=1 \
            -p EnvironmentFile=/etc/picwise/picwise.env \
            -p Nice=10 -p MemoryHigh=4G -p MemoryMax=5G -p RuntimeMaxSec=40min \
            -p NoNewPrivileges=yes -p ProtectSystem=strict -p ProtectHome=yes -p PrivateTmp=yes \
            /usr/bin/python3 -" < "$RUNNER_TEMP/checks_bundle.py"
      - name: Remove the key from the runner
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/config
