# A look at what the photos' check would leave out with the checks' switch on, before the
# «ανέβασε» of the checks (the checks' rules 5.4; owner, 2026-11-21, of a photo that does
# not answer: «Αμέσως, για κάθε λόγο»; task 7). The deployment itself starts the strict
# check, and what it finds is off the site within the hour, so it is counted first. The work
# is deployment/server/look_photos.py with this commit's check_photos.py bundled in (the
# release in use does not carry the strict check), run on the server as the site's user: what
# the night's check holds today (its database, opened read-only), then a sample asked as the
# strict check asks (the photos it could not read, and 40 of each shop). It changes nothing.
#
# On a push of its own branch that changes the scripts or this file. The repository is public
# and so is this log: the server's names are masked; the script prints counts, HTTP statuses,
# content types and shop names only, never an address.
#
# Run: 2026-11-22 11:00 Athens (task 7, the first look; to run again, change this line and push).
name: Server look at the photos (read-only)
on:
  push:
    branches: [claude/look-photos-2026-11-22]
    paths:
      - '.github/workflows/server-look-photos.yml'
      - 'deployment/server/look_photos.py'
      - 'deployment/server/check_photos.py'
permissions:
  contents: read
concurrency:
  group: server-setup
  cancel-in-progress: false
jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Connect with the key, check the server's identity, mask its names
        id: connect
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          # A key pasted on Windows may carry carriage returns, which ssh refuses.
          printf '%s\n' "$SERVER_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # As server-deploy.yml: the server must show a login the host key pinned in
          # .github/server-host-key.pin, and every connection below accepts that key only.
          seen="$RUNNER_TEMP/seen"
          : > "$seen"
          ssh -F /dev/null -o BatchMode=yes -o ConnectTimeout=15 -o HostKeyAlgorithms=ssh-ed25519 \
            -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$seen" -o GlobalKnownHostsFile=/dev/null \
            -o PubkeyAuthentication=no -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no \
            -o HostbasedAuthentication=no -o GSSAPIAuthentication=no -o LogLevel=QUIET \
            "ubuntu@$SERVER_HOST" true 2>/dev/null || true
          host_key=$(awk 'NF >= 3 {print $2, $3; exit}' "$seen")
          rm -f "$seen"
          [ -n "$host_key" ] || { echo "the server showed a login no host key"; exit 1; }
          pin=$(HOST_KEY="$host_key" python3 .github/scripts/host_key_pin.py)
          expected=$( (grep -v '^#' .github/server-host-key.pin || true) | tr -d '[:space:]')
          if [ "$pin" != "$expected" ]; then
            echo "the server does NOT match the pin (reinstalled, or not our server); its pin: $pin"
            exit 1
          fi
          echo "the server matches the pin"
          echo "picwise-server $host_key" > ~/.ssh/known_hosts_picwise
          cat > ~/.ssh/config <<EOF
          Host picwise
            HostName $SERVER_HOST
            HostKeyAlias picwise-server
            UserKnownHostsFile ~/.ssh/known_hosts_picwise
            StrictHostKeyChecking yes
            User ubuntu
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 8
            LogLevel ERROR
          EOF
          chmod 600 ~/.ssh/config
          # The host name resolves to the address, so it is masked like the address.
          names=$(ssh -n picwise 'hostname; hostname -f; hostname -I')
          for name in $names; do echo "::add-mask::$name"; done
          echo "connected"
      - name: Look at the photos, once
        if: steps.connect.outcome == 'success'
        run: |
          python3 deployment/server/look_photos.py --bundle > "$RUNNER_TEMP/photos_look.py"
          # In a unit of its own with its own limits: the prepared catalogue read once beside
          # the site, the release's code on its path, nothing writable under /srv.
          ssh picwise "sudo systemd-run --quiet --wait --pipe --collect \
            -p User=picwise -p Group=picwise -p WorkingDirectory=/srv/picwise/current \
            -p Environment=PYTHONPATH=/srv/picwise/current/src -p Environment=PYTHONDONTWRITEBYTECODE=1 \
            -p Nice=10 -p MemoryHigh=4G -p MemoryMax=5G -p RuntimeMaxSec=25min \
            -p NoNewPrivileges=yes -p ProtectSystem=strict -p ProtectHome=yes -p PrivateTmp=yes \
            /usr/bin/python3 -" < "$RUNNER_TEMP/photos_look.py"
      - name: Remove the key from the runner
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/config
