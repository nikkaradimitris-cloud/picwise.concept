# The look before the «ανέβασε» of the home page as a store (task H5;
# docs/PICWISE_HOME_STORE_SPEC.md, sections 9 and 10.2; the owner's «Έλεγχος», 2026-11-24).
# Read-only: nothing on the server or the site changes, no shop is asked, nothing is asked
# of any AI, no search is kept.
#
# 1. On the server (deployment/server/look_home_store.py), as the site's user, in a unit of
#    its own whose files are read-only, from a copy of this commit's code in the unit's
#    private temporary folder, which goes with the unit: the switch off, today's pages and
#    searches against the running site's, byte for byte; the switch on in that process
#    alone: the night's facts (their time and memory), every department's kinds by their
#    own words, every page, every link inside the site followed in the process (never a
#    shop's button), each Recommended against its search, each offer against its products.
# 2. On this runner (deployment/server/measure_store_pages.py): a few of those pages in a
#    browser, every request to another host refused (no shop is asked): what is tapped,
#    the words' sizes, the width, and Google's three measures on a slow phone.
#
# On a push of its own branch that changes the scripts or this file. The repository is
# public and so is this log: the server's names and addresses are masked; the scripts
# print shops, titles and prices as the site shows them, never an address or a link.
#
# Run: 2026-11-24 11:40 Athens, after the deployment: a live search's page kept today's frame (to run again, change this line and push).
# (A branch pushed with no commit of its own starts nothing: the first push did not run.)
name: Server look at the home page as a store (read-only)
on:
  push:
    branches: [claude/look-home-store]
    paths:
      - '.github/workflows/server-look-home-store.yml'
      - 'deployment/server/look_home_store.py'
      - 'deployment/server/measure_store_pages.py'
permissions:
  contents: read
# Shared with server-setup.yml and server-deploy.yml: never while the server is set up or
# a release deployed.
concurrency:
  group: server-setup
  cancel-in-progress: false
jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Connect with the key, check the server's identity, mask its names
        id: connect
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          # A key pasted on Windows may carry carriage returns, which ssh refuses.
          printf '%s\n' "$SERVER_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # As server-deploy.yml: the server must show a login the host key pinned in
          # .github/server-host-key.pin, and every connection below accepts that key only.
          seen="$RUNNER_TEMP/seen"
          : > "$seen"
          ssh -F /dev/null -o BatchMode=yes -o ConnectTimeout=15 -o HostKeyAlgorithms=ssh-ed25519 \
            -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$seen" -o GlobalKnownHostsFile=/dev/null \
            -o PubkeyAuthentication=no -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no \
            -o HostbasedAuthentication=no -o GSSAPIAuthentication=no -o LogLevel=QUIET \
            "ubuntu@$SERVER_HOST" true 2>/dev/null || true
          host_key=$(awk 'NF >= 3 {print $2, $3; exit}' "$seen")
          rm -f "$seen"
          [ -n "$host_key" ] || { echo "the server showed a login no host key"; exit 1; }
          pin=$(HOST_KEY="$host_key" python3 .github/scripts/host_key_pin.py)
          expected=$( (grep -v '^#' .github/server-host-key.pin || true) | tr -d '[:space:]')
          if [ "$pin" != "$expected" ]; then
            echo "the server does NOT match the pin (reinstalled, or not our server); its pin: $pin"
            exit 1
          fi
          echo "the server matches the pin"
          echo "picwise-server $host_key" > ~/.ssh/known_hosts_picwise
          cat > ~/.ssh/config <<EOF
          Host picwise
            HostName $SERVER_HOST
            HostKeyAlias picwise-server
            UserKnownHostsFile ~/.ssh/known_hosts_picwise
            StrictHostKeyChecking yes
            User ubuntu
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 8
            LogLevel ERROR
          EOF
          chmod 600 ~/.ssh/config
          # The host name resolves to the address, so it is masked like the address.
          names=$(ssh -n picwise 'hostname; hostname -f; hostname -I')
          for name in $names; do echo "::add-mask::$name"; done
          echo "connected"
      - name: The server beside the look
        if: steps.connect.outcome == 'success'
        run: |
          ssh -n picwise 'date -u "+now %Y-%m-%d %H:%M:%S UTC"; free -m | awk "/^Mem:/ {print \"the server: \" \$2 \" MB of memory, \" \$7 \" MB available\"}"; for unit in picwise-web picwise-checks picwise-prepare picwise-shops; do echo "$unit: $(systemctl is-active $unit.service)"; done; readlink -f /srv/picwise/current | sed "s#.*/##; s#^#the release in use: #"'
      - name: Look, once (nothing written, no shop asked)
        if: steps.connect.outcome == 'success'
        run: |
          tar czf "$RUNNER_TEMP/code.tgz" src deployment data api assets
          echo "this commit's code: $(( $(stat -c %s "$RUNNER_TEMP/code.tgz") / 1024 )) KB"
          # A unit of its own, nothing writable under /srv: the code is unpacked in the unit's
          # private /tmp, which goes with the unit. The report comes on standard error (this
          # log), a few pages on standard output for the browser below.
          ssh picwise "sudo systemd-run --quiet --wait --pipe --collect \
            -p User=picwise -p Group=picwise -p Environment=PYTHONDONTWRITEBYTECODE=1 \
            -p Nice=10 -p MemoryHigh=4G -p MemoryMax=5G -p RuntimeMaxSec=30min -p UMask=0027 \
            -p NoNewPrivileges=yes -p PrivateTmp=yes -p PrivateDevices=yes -p ProtectSystem=strict -p ProtectHome=yes \
            -p ProtectKernelTunables=yes -p ProtectKernelModules=yes -p ProtectKernelLogs=yes -p ProtectControlGroups=yes \
            -p RestrictNamespaces=yes -p RestrictRealtime=yes -p RestrictSUIDSGID=yes -p LockPersonality=yes \
            -p SystemCallArchitectures=native -p CapabilityBoundingSet= \
            /bin/sh -c 'mkdir /tmp/look && cd /tmp/look && tar xzf - && exec /usr/bin/python3 deployment/server/look_home_store.py'" \
            < "$RUNNER_TEMP/code.tgz" > "$RUNNER_TEMP/pages.tgz"
          echo "the pages for the browser: $(( $(stat -c %s "$RUNNER_TEMP/pages.tgz") / 1024 )) KB"
      - name: Remove the key from the runner
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/config
      - name: A few of the pages in a browser, on this runner (no other host asked)
        if: steps.connect.outcome == 'success'
        run: |
          mkdir "$RUNNER_TEMP/pages"
          tar xzf "$RUNNER_TEMP/pages.tgz" -C "$RUNNER_TEMP/pages"
          python3 -m pip install --quiet --disable-pip-version-check --break-system-packages playwright || python3 -m pip install --quiet --disable-pip-version-check playwright
          python3 deployment/server/measure_store_pages.py "$RUNNER_TEMP/pages"
