# Read-only look at what the server did in the night (owner's «Ναι», 2026-10-26): the
# shops' round (picwise-shops.timer, 03:40 UTC) and the preparation after it
# (picwise-prepare.timer, 04:17 UTC), each read from its timer's last start, then each
# shop of the prepared catalogue. It starts no round and changes nothing on the server.
#
# The server's identity is its host key against .github/server-host-key.pin, as in every
# workflow, but taken from a login's first step rather than a key scan: since the night
# of 26-27/10 a key scan is shown another key while logins are shown the pinned one
# (server-keys.yml, run 40501323803; owner's «ναι», 2026-10-27). When even that key does
# not match, this workflow, which sends the server no secret, asks for a proof instead:
# the server seals a random nonce under the feed link (.github/scripts/feed_seal.py),
# which only it and GitHub hold, and the link never travels. When the key scan's key
# differs, or the pin does not match, the server is also asked what answers a key scan,
# why its key changed, and who logged in since the deployment of 26/10.
#
# Runs when this file is pushed to the working branch; to read another night, change the
# date below and push. The repository is public and so is this log: the server's names
# and addresses are masked, no address or host key is printed, and the bot prints shop
# names and counts.
#
# Night read: 2026-10-27, the key from a login's first step
name: Server night (read-only)
on:
  push:
    branches: [ccr-1361f1a7-dcpo60]
    paths:
      - '.github/workflows/server-night.yml'
permissions:
  contents: read
# Shared with the deployment, the setup and the shops' round, so nothing is read while
# one of them runs.
concurrency:
  group: server-setup
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Connect with the key, check the server's identity, mask its names
        id: connect
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          AWIN_FEED_URL: ${{ secrets.AWIN_FEED_URL }}
        run: |
          install -m 700 -d ~/.ssh
          # A key pasted on Windows may carry carriage returns, which ssh refuses.
          printf '%s\n' "$SERVER_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The server must show a login the host key pinned in .github/server-host-key.pin
          # (an HMAC under the deploy key: .github/scripts/host_key_pin.py), or prove below
          # that it holds the feed link; every connection accepts the key it showed only.
          # The key is the one a login's first step is shown: an ssh client offering no
          # key or password writes it down, and the login ends there.
          seen="$RUNNER_TEMP/seen"
          : > "$seen"
          ssh -F /dev/null -o BatchMode=yes -o ConnectTimeout=15 -o HostKeyAlgorithms=ssh-ed25519 \
            -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$seen" -o GlobalKnownHostsFile=/dev/null \
            -o PubkeyAuthentication=no -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no \
            -o HostbasedAuthentication=no -o GSSAPIAuthentication=no -o LogLevel=QUIET \
            "ubuntu@$SERVER_HOST" true 2>/dev/null || true
          host_key=$(awk 'NF >= 3 {print $2, $3; exit}' "$seen")
          rm -f "$seen"
          [ -n "$host_key" ] || { echo "the server showed a login no host key"; exit 1; }
          pin=$(HOST_KEY="$host_key" python3 .github/scripts/host_key_pin.py)
          expected=$( (grep -v '^#' .github/server-host-key.pin || true) | tr -d '[:space:]')
          if [ "$pin" = "$expected" ]; then
            echo "the server matches the pin"
            echo "pinned=yes" >> "$GITHUB_OUTPUT"
          else
            echo "the server does NOT match the pin (reinstalled, or not our server); its pin: $pin"
            echo "pinned=no" >> "$GITHUB_OUTPUT"
          fi
          # What a key scan is shown, only to report it.
          scanned=$(ssh-keyscan -T 15 -t ed25519 "$SERVER_HOST" 2>/dev/null | awk 'NF >= 3 {print $2, $3; exit}')
          scan_pin=""
          if [ -n "$scanned" ]; then scan_pin=$(HOST_KEY="$scanned" python3 .github/scripts/host_key_pin.py); fi
          if [ "$scan_pin" = "$pin" ]; then
            echo "a key scan is shown the same key"
            echo "scan_differs=no" >> "$GITHUB_OUTPUT"
          else
            echo "a key scan is shown another key (pin ${scan_pin:-none})"
            echo "scan_differs=yes" >> "$GITHUB_OUTPUT"
            echo "scan_pin=$scan_pin" >> "$GITHUB_OUTPUT"
          fi
          echo "picwise-server $host_key" > ~/.ssh/known_hosts_picwise
          # The user is OVHcloud's for Ubuntu, written here rather than read from the
          # SERVER_USER secret: GitHub masks a secret's value all over the log.
          cat > ~/.ssh/config <<EOF
          Host picwise
            HostName $SERVER_HOST
            HostKeyAlias picwise-server
            UserKnownHostsFile ~/.ssh/known_hosts_picwise
            StrictHostKeyChecking yes
            User ubuntu
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 8
            LogLevel ERROR
          EOF
          chmod 600 ~/.ssh/config
          # Without the pin, the server must seal a random nonce under the feed link as
          # GitHub does: only the nonce goes to it, only the seal comes back.
          nonce=$(python3 -c 'import secrets; print(secrets.token_hex(32))')
          ours=$(python3 .github/scripts/feed_seal.py "$nonce") || ours=""
          unset AWIN_FEED_URL
          if [ "$pin" != "$expected" ]; then
            [ -n "$ours" ] || { echo "no feed link in GitHub's secrets: nothing can prove the server is ours"; exit 1; }
            # What any visitor of port 22 is told first: its SSH software and system.
            banner=$(timeout 10 bash -c 'exec 3<>"/dev/tcp/$1/22"; head -n 1 <&3' _ "$SERVER_HOST" 2>/dev/null \
              | tr -cd '[:print:]' | cut -c1-80 || true)
            echo "the server's SSH software says: ${banner:-nothing}"
            # The server's own words are never printed: its errors are only sorted.
            errors="$RUNNER_TEMP/seal-errors"
            theirs=$(ssh picwise "sudo -n python3 - $nonce" < .github/scripts/feed_seal.py 2> "$errors") && status=0 || status=$?
            if [ "$theirs" != "$ours" ]; then
              if grep -q 'Permission denied' "$errors"; then why="it did not let the deploy key in"
              elif grep -q 'Host key verification failed' "$errors"; then why="its host key changed again during the run"
              elif [ "$status" = 255 ]; then why="the login did not complete"
              elif grep -q 'sudo:' "$errors"; then why="the deploy key was let in, but sudo was refused"
              elif grep -q 'feed_seal: no feed link' "$errors"; then why="the deploy key was let in, but the server holds no feed link"
              elif [ "$status" = 0 ]; then why="the deploy key was let in, but its seal is not GitHub's (another feed link)"
              else why="the deploy key was let in, but sealing failed (exit $status)"
              fi
              rm -f "$errors"
              echo "the server could NOT prove it holds the feed link: $why; nothing is read"
              exit 1
            fi
            rm -f "$errors"
            echo "the server proved it holds the feed link: it is ours, with a new host key"
          fi
          # The host name resolves to the address, so it is masked like the address.
          names=$(ssh -n picwise 'hostname; hostname -f; hostname -I')
          for name in $names; do echo "::add-mask::$name"; done
          echo "connected"
      - name: What answers a key scan with another key, why, and who logged in since 26/10
        if: steps.connect.outputs.scan_differs == 'yes' || steps.connect.outputs.pinned == 'no'
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SCAN_PIN: ${{ steps.connect.outputs.scan_pin }}
        run: |
          # The ed25519 host key the server keeps on disk, named by its pin.
          pinned=$( (grep -v '^#' .github/server-host-key.pin || true) | tr -d '[:space:]')
          on_disk=$(ssh -n picwise 'cat /etc/ssh/ssh_host_ed25519_key.pub' | awk 'NF >= 2 {print $1, $2; exit}')
          disk_pin=""
          if [ -n "$on_disk" ]; then disk_pin=$(HOST_KEY="$on_disk" python3 .github/scripts/host_key_pin.py); fi
          if [ -z "$disk_pin" ]; then echo "the ed25519 host key on the server's disk: none read"
          elif [ "$disk_pin" = "$pinned" ]; then echo "the ed25519 host key on the server's disk: the pinned one"
          elif [ "$disk_pin" = "$SCAN_PIN" ]; then echo "the ed25519 host key on the server's disk: the one a key scan is shown"
          else echo "the ed25519 host key on the server's disk: another (pin ${disk_pin:0:8})"
          fi
          # The deploy key's fingerprint, to tell its logins from any other's.
          deploy_fp=$(ssh-keygen -lf ~/.ssh/deploy_key | awk '{print $2}')
          [ -n "$deploy_fp" ] || echo "the deploy key's fingerprint could not be read: each login below shows as another key"
          ssh picwise "bash -s -- '$deploy_fp'" <<'EOF'
          echo "booted at $(uptime -s) $(date +%Z)"
          echo "the last boots in the journal:"
          sudo journalctl --list-boots --no-pager | tail -n 4
          echo "listening on port 22, and by whom:"
          sudo ss -ltnpH 'sport = :22'
          echo "ssh's socket: $(systemctl is-active ssh.socket); ssh's service: $(systemctl is-active ssh.service)"
          echo "sshd processes:"
          pgrep -a sshd | cut -c1-120
          echo "sshd's own settings for its host keys and where it listens:"
          sudo sshd -T 2>/dev/null | grep -iE '^(hostkey|port|listenaddress) ' | cut -c1-160
          echo "/etc/ssh and its drop-ins, last written:"
          sudo ls -l --time-style=+%Y-%m-%dT%H:%M /etc/ssh /etc/ssh/sshd_config.d | cut -c1-160
          echo "port 22 rewritten to elsewhere (none expected):"
          sudo iptables -t nat -S 2>/dev/null | grep -- '--dport 22' || echo "  none in iptables"
          sudo nft list ruleset 2>/dev/null | grep -E 'dport 22' || echo "  none in nftables"
          echo "the updates of 26-27/10:"
          grep -E '^(Start-Date|Upgrade|Install|Remove)' /var/log/apt/history.log 2>/dev/null \
            | grep -A3 '^Start-Date: 2026-10-2[67]' | cut -c1-300 | tail -n 12
          echo "the host keys, last written:"
          sudo stat -c '%y %n' /etc/ssh/ssh_host_*_key.pub
          echo "cloud-init's instance: $(sudo cat /var/lib/cloud/data/instance-id 2>/dev/null || echo unknown);" \
            "the one before: $(sudo cat /var/lib/cloud/data/previous-instance-id 2>/dev/null || echo unknown)"
          echo "cloud-init's runs, and what it did to the host keys (no key printed):"
          sudo grep -hE 'Cloud-init v\. .* running|ssh-keygen|ssh_host_|previous iid|new instance' \
            /var/log/cloud-init.log 2>/dev/null | grep -vE 'SHA256:|AAAA' | tail -n 20
          echo "the updates' reboots:"
          sudo grep -hi 'reboot' /var/log/unattended-upgrades/unattended-upgrades.log 2>/dev/null | tail -n 4
          echo
          echo "logins over SSH since 26/10 16:00 UTC (no addresses):"
          sudo journalctl -t sshd -t sshd-session --since '2026-10-26 16:00:00 UTC' -o short-iso --no-pager \
            | awk -v fp="$1" '
                / Accepted / {
                  for (i = 1; i <= NF && $i != "Accepted"; i++) ;
                  kind = ($NF == fp) ? "the deploy key" : ($(i + 1) == "publickey" ? "another key" : $(i + 1))
                  count[$(i + 3) " with " kind]++; n++
                  if (kind != "the deploy key") print "  " $1, $(i + 3), kind
                }
                END { for (k in count) print "  " count[k] " as " k; if (!n) print "  none" }'
          echo "logins on the console (OVHcloud's KVM) since then:"
          sudo journalctl -t login --since '2026-10-26 16:00:00 UTC' -o cat --no-pager | tail -n 5
          EOF
      - name: The night's round of the shops, then the preparation
        # The script goes to the server on stdin, so no quote inside it can close the
        # command, as an apostrophe did in run 40328993620.
        run: |
          ssh picwise 'bash -s' <<'EOF'
          echo "release in use: $(basename "$(readlink -f /srv/picwise/current)")"
          for unit in shops prepare; do
            # A timer's last start is kept on disk (Persistent=true), so it outlives a reboot.
            since=$(systemctl show -p LastTriggerUSec --value "picwise-$unit.timer")
            echo
            case "$since" in "" | n/a) echo "== picwise-$unit.timer has not started its service yet"; continue ;; esac
            echo "== picwise-$unit.timer started its service at $since"
            systemctl show -p Result -p ExecMainStartTimestamp -p ExecMainExitTimestamp "picwise-$unit.service"
            if [ "$unit" = shops ]; then
              sudo journalctl -u picwise-shops.service -o cat --no-pager --since "$since"
            else
              # The summary lines of each run since then, the timer's and any deployment's.
              sudo journalctl -u picwise-prepare.service -o cat --no-pager --since "$since" \
                | grep -E 'prepare_catalogue|Consumed' || true
            fi
          done
          echo
          systemctl list-timers picwise-shops.timer picwise-prepare.timer --no-legend
          sudo python3 -c "import json; d = json.load(open('/srv/picwise/shared/public/prepared.json')); print('prepared:', d.get('prepared'), d.get('prepared_at', d.get('reason')), d.get('products'), 'products,', d.get('shops'), 'shops')"
          EOF
      - name: Each shop of the prepared catalogue
        if: always() && steps.connect.outcome == 'success'
        run: ssh -n picwise 'sudo cat /srv/picwise/shared/public/prepared.json' | python3 deployment/server/print_shops.py
      - name: Kinds that may be wrong in the prepared catalogue
        if: always() && steps.connect.outcome == 'success'
        run: ssh -n picwise 'sudo cat /srv/picwise/shared/public/prepared.json' | python3 deployment/server/print_kinds.py
      - name: Remove the key from the runner
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/config
