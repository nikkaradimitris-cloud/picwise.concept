# Every test module, on each push of code.
#
# The audit of 2026-11-10 found that no workflow ran the tests and that a deployment did
# not wait for them: whether they had passed rested on the session having run them by
# hand. This runs each module in a process of its own (tools/run_test_modules.py) on a
# push that changes code, on any session's branch, and by hand. It reads the repository
# and nothing else: no key, no server, nothing deployed. It is red only when a module
# fails that is not known to fail (the two README.md names, each with its one test, run
# and reported every time), or does not finish.
#
# It does not stand in front of a deployment: a push to the deploying branch still
# deploys on the owner's word (server-deploy.yml). Whoever deploys looks at this run of
# the commit first.
name: Tests
on:
  push:
    branches: ["ccr-**"]
    paths:
      - "src/**"
      - "api/**"
      - "tests/**"
      - "tools/**"
      - "deployment/**"
      - "wsgi.py"
      - "run_picwise_app.py"
      - ".github/workflows/tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  modules:
    name: Every module but the two slow ones
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # A newer push makes this run of an older commit pointless.
    concurrency:
      group: tests-modules-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Each test module on its own
        run: python tools/run_test_modules.py --skip-slow
  slow:
    name: The two slow modules
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # Never cut short by a newer push: they take long and a session pushes each step, so
    # a run a push could cancel would never finish. A newer one waits its turn.
    concurrency:
      group: tests-slow-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Each slow module on its own
        run: python tools/run_test_modules.py --only-slow --timeout 7200
