# A trial of the night's preparation with both Awin links (owner, 2026-11-19: the
# Awin-format feeds come back in a second link; the cap's limits, 15% and at most 12,000 a
# category, set on the server), on GitHub's runner and not on the server: how many
# products each category keeps, which shops come in, the memory and the time it takes,
# before the second link is given to the server. Read-only: nothing on the server or the
# site changes. Run by hand. The repository is public and so is this log: the links are
# secrets, never printed; counts and names of categories and shops only.
name: Trial preparation, both Awin links (read-only)
on:
  workflow_dispatch:
    inputs:
      share:
        description: "The cap's share (PICWISE_CAP_SHARE)"
        default: "0.15"
      category_max:
        description: "The most a category keeps (PICWISE_CAP_CATEGORY_MAX; 0 for none)"
        default: "12000"
      first_alone:
        description: "Prepare the first link alone too (yes or no)"
        default: "no"
      compare:
        description: "Prepare with the live site's code too and compare the catalogues (yes or no)"
        default: "no"
permissions:
  contents: read
jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Download both links
        env:
          AWIN_FEED_URL: ${{ secrets.AWIN_FEED_URL }}
          AWIN_FEED_URL_AWIN: ${{ secrets.AWIN_FEED_URL_AWIN }}
        run: |
          set -e
          curl -sS --fail --max-time 900 -o "$RUNNER_TEMP/google.bin" "$AWIN_FEED_URL" || { echo "the first link could not be read"; exit 1; }
          curl -sS --fail --max-time 900 -o "$RUNNER_TEMP/awin.bin" "$AWIN_FEED_URL_AWIN" || { echo "the second link could not be read"; exit 1; }
          ls -l "$RUNNER_TEMP"/*.bin | awk '{printf "%s: %.1f MB\n", $NF, $5/1048576}' | sed "s|$RUNNER_TEMP/||"
          free -g | awk '/^Mem:/ {print "the runner: " $2 " GB of memory"}'
      - name: Prepare, first link alone (today's catalogue)
        if: inputs.first_alone == 'yes'
        env:
          PICWISE_CAP_SHARE: ${{ inputs.share }}
          PICWISE_CAP_CATEGORY_MAX: ${{ inputs.category_max }}
        run: |
          mkdir -p "$RUNNER_TEMP/one"
          /usr/bin/time -f "peak memory %M KB, %e s" python3 tools/prepare_catalogue.py --keep-going \
            --feed-file "$RUNNER_TEMP/google.bin" --out "$RUNNER_TEMP/one/catalogue.json.gz" --static-dir "$RUNNER_TEMP/one" 2>&1 | tail -n 4
      - name: Prepare, both links
        env:
          PICWISE_CAP_SHARE: ${{ inputs.share }}
          PICWISE_CAP_CATEGORY_MAX: ${{ inputs.category_max }}
          AWIN_FEED_FILE_AWIN: ${{ runner.temp }}/awin.bin
          PICWISE_MEMORY_TRACE: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/both"
          # Each large step's memory (tools/measure_prepare_memory.py, 2026-11-25: before the
          # preparation is cut into packages of shops, where the memory goes).
          /usr/bin/time -f "peak memory %M KB, %e s" python3 tools/measure_prepare_memory.py --keep-going \
            --feed-file "$RUNNER_TEMP/google.bin" --out "$RUNNER_TEMP/both/catalogue.json.gz" --static-dir "$RUNNER_TEMP/both" 2>&1 | grep -E "^memory step|^prepare_catalogue|peak memory|Command" | tail -n 60
      - name: The live site's code on the same feed, to compare
        if: inputs.compare == 'yes'
        uses: actions/checkout@v5
        with:
          ref: ccr-1361f1a7-dcpo60
          path: live-code
          persist-credentials: false
      - name: Prepare both links with the live site's code, then compare the two catalogues
        if: inputs.compare == 'yes'
        env:
          PICWISE_CAP_SHARE: ${{ inputs.share }}
          PICWISE_CAP_CATEGORY_MAX: ${{ inputs.category_max }}
          AWIN_FEED_FILE_AWIN: ${{ runner.temp }}/awin.bin
        run: |
          mkdir -p "$RUNNER_TEMP/live"
          /usr/bin/time -f "peak memory %M KB, %e s (the live site's code)" python3 live-code/tools/prepare_catalogue.py --keep-going \
            --feed-file "$RUNNER_TEMP/google.bin" --out "$RUNNER_TEMP/live/catalogue.json.gz" --static-dir "$RUNNER_TEMP/live" 2>&1 | grep -E "^prepare_catalogue: [0-9]|peak memory" | tail -n 3
          # The same products, fields and notes; only the time and the code's fingerprint may differ.
          python3 - "$RUNNER_TEMP/live" "$RUNNER_TEMP/both" <<'PY'
          import gzip, json, sys
          from pathlib import Path
          live, new = (Path(folder) for folder in sys.argv[1:3])
          a = json.load(gzip.open(live / "catalogue.json.gz"))
          b = json.load(gzip.open(new / "catalogue.json.gz"))
          volatile = {"prepared_at", "code"}
          differ = sorted(key for key in set(a) | set(b) if key not in volatile and a.get(key) != b.get(key))
          print(f"the catalogue: {len(a.get('products', [])):,} products with the live code, {len(b.get('products', [])):,} with the new;",
                "the same in every field" if not differ else f"DIFFERENT in: {', '.join(differ)}")
          na = json.loads((live / "prepared.json").read_text())
          nb = json.loads((new / "prepared.json").read_text())
          for key in ("intake", "kinds", "title_alone", "balance", "freshness", "shop_catalogues", "products", "shops"):
              if key in na or key in nb:
                  print(f"the note's {key}:", "the same" if na.get(key) == nb.get(key) else "DIFFERENT")
          sys.exit(1 if differ or na.get("intake") != nb.get("intake") else 0)
          PY
      - name: What each kept, by category and shop
        if: always()
        run: python3 .github/scripts/print_trial.py "$RUNNER_TEMP/one" "$RUNNER_TEMP/both"
      - name: Remove the feeds
        if: always()
        run: rm -rf "$RUNNER_TEMP"/*.bin "$RUNNER_TEMP/one" "$RUNNER_TEMP/both" "$RUNNER_TEMP/live"
