# What a cap of 15% a category would keep of the server's prepared catalogue (owner,
# 2026-10-27: «Ναι»; no category of like products over 15% of all products, measured
# first). GitHub's runner copies the server's file and measures it with this commit's code
# (deployment/server/print_cap.py, picwise_providers.catalogue_cap); nothing on the server
# or shown changes, and nothing is deployed. The server's identity as in server-night.yml:
# the key a login's first step is shown, against the pin, or else the feed link's seal.
# Then the prices at the ends (owner, 2026-10-27: «Κάνε τη μέτρηση»), and the products
# priced far outside their kind's usual prices and their own shop's, a check for wrong
# kinds (owner's «Ναι», the same day; deployment/server/print_prices.py). Then the kinds
# this commit's rules read, set against the ones the server stored, and the check of far
# prices again with them (owner, 2026-10-27: «Διόρθω τους κανόνες και άντε να δούμε πού
# θα καταλήξουμε τελικά»; deployment/server/print_kind_changes.py), with the words each
# change's titles share most, and the accessories the cap counts in the kind their shelf
# names (the check of far prices leaves them on their shelf), with the word their titles
# put right after its name. Then each change of the rules on its own (owner, 2026-10-28:
# the three things to finish, each measured before it is built): the kinds the rules of
# each commit of RULES_STEPS read (deployment/server/kinds_of.py, each from a worktree of
# its commit), set against the next's, and the last against this commit's. Then which
# words are general and the choices a search for each could offer (owner, 2026-10-28/29:
# «καλώδιο» answered with which cable, one logic for every general word;
# deployment/server/print_choices.py, picwise_providers.kind_choices): each choice in the
# words the titles use, from 20 products whatever its share of the kind. Then what a buyer
# would see (owner, 2026-10-29: «Ναι προχώρα, βάλ' το στο search»): the copy prepared again
# with this commit's rules and searched in-process, each general word and each of its
# choices (deployment/server/print_search_choices.py), before any deployment. Before it,
# what each rule of the choices changes on its own (owner, 2026-10-29: «εσύ πρέπει να
# αποφασίσεις ποιος είναι ο βέλτιστος τρόπος»; deployment/server/print_choice_rules.py):
# one shop's words, halves of phrases, choices keeping the whole kind, the written noun,
# one search offered twice, the shops' shelves, each choice weighed by what its own
# search finds, eight offered (the rules as refined after runs 41028398470, 41031539622,
# 41034288478 and 41036545617, 2026-10-30). And item 3 (owner, 2026-10-30: «Όλα στο
# search»): the cap chooses only the pool Google may be given from, kept each night for
# the next; print_cap.py says what the next night keeps, the pool its starting point. And
# the gaps (owner, 2026-10-31: «Ναι, κάνε τη μέτρηση»): which kinds have products from fewer
# than 3 shops and which have none, by mega-category (deployment/server/print_gaps.py), so
# that the owner knows which shops to look for. MEASURE says which measures a run takes:
# "gaps" alone, or "all". The rules reach the server only with a deployment. Runs when this file is pushed to
# the working branch. The repository is public and so is this log: the server's names and
# addresses are masked, and the measures print counts, names, titles and prices, never a
# link.
name: Server cap (read-only, measured only)
on:
  push:
    branches: [ccr-1361f1a7-dcpo60]
    paths:
      - '.github/workflows/server-cap.yml'
permissions:
  contents: read
# Shared with the deployment, the setup and the shops' round, so the file is never
# copied while one of them writes it.
concurrency:
  group: server-setup
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The commits whose rules are measured step by step before this one's, one change
      # of the kind rules at a time (2026-10-29: cb40587 and 0546e91 for the English
      # "with" and the metals after a name). None this time: the run measures the
      # choices a search for a general word could offer, with this commit's rules.
      RULES_STEPS: ""
      # "gaps": the kinds short of shops only (a minute); "all": every measure below.
      MEASURE: gaps
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # The commits of RULES_STEPS, for their worktrees.
          fetch-depth: 0
      - name: Connect with the key, check the server's identity, mask its names
        id: connect
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          AWIN_FEED_URL: ${{ secrets.AWIN_FEED_URL }}
        run: |
          install -m 700 -d ~/.ssh
          # A key pasted on Windows may carry carriage returns, which ssh refuses.
          printf '%s\n' "$SERVER_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The server must show a login the host key pinned in .github/server-host-key.pin
          # (an HMAC under the deploy key: .github/scripts/host_key_pin.py), or prove below
          # that it holds the feed link; every connection accepts the key it showed only.
          # The key is the one a login's first step is shown: an ssh client offering no
          # key or password writes it down, and the login ends there.
          seen="$RUNNER_TEMP/seen"
          : > "$seen"
          ssh -F /dev/null -o BatchMode=yes -o ConnectTimeout=15 -o HostKeyAlgorithms=ssh-ed25519 \
            -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$seen" -o GlobalKnownHostsFile=/dev/null \
            -o PubkeyAuthentication=no -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no \
            -o HostbasedAuthentication=no -o GSSAPIAuthentication=no -o LogLevel=QUIET \
            "ubuntu@$SERVER_HOST" true 2>/dev/null || true
          host_key=$(awk 'NF >= 3 {print $2, $3; exit}' "$seen")
          rm -f "$seen"
          [ -n "$host_key" ] || { echo "the server showed a login no host key"; exit 1; }
          pin=$(HOST_KEY="$host_key" python3 .github/scripts/host_key_pin.py)
          expected=$( (grep -v '^#' .github/server-host-key.pin || true) | tr -d '[:space:]')
          if [ "$pin" = "$expected" ]; then
            echo "the server matches the pin"
            echo "pinned=yes" >> "$GITHUB_OUTPUT"
          else
            echo "the server does NOT match the pin (reinstalled, or not our server); its pin: $pin"
            echo "pinned=no" >> "$GITHUB_OUTPUT"
          fi
          # What a key scan is shown, only to report it.
          scanned=$(ssh-keyscan -T 15 -t ed25519 "$SERVER_HOST" 2>/dev/null | awk 'NF >= 3 {print $2, $3; exit}')
          scan_pin=""
          if [ -n "$scanned" ]; then scan_pin=$(HOST_KEY="$scanned" python3 .github/scripts/host_key_pin.py); fi
          if [ "$scan_pin" = "$pin" ]; then
            echo "a key scan is shown the same key"
            echo "scan_differs=no" >> "$GITHUB_OUTPUT"
          else
            echo "a key scan is shown another key (pin ${scan_pin:-none})"
            echo "scan_differs=yes" >> "$GITHUB_OUTPUT"
            echo "scan_pin=$scan_pin" >> "$GITHUB_OUTPUT"
          fi
          echo "picwise-server $host_key" > ~/.ssh/known_hosts_picwise
          # The user is OVHcloud's for Ubuntu, written here rather than read from the
          # SERVER_USER secret: GitHub masks a secret's value all over the log.
          cat > ~/.ssh/config <<EOF
          Host picwise
            HostName $SERVER_HOST
            HostKeyAlias picwise-server
            UserKnownHostsFile ~/.ssh/known_hosts_picwise
            StrictHostKeyChecking yes
            User ubuntu
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 8
            LogLevel ERROR
          EOF
          chmod 600 ~/.ssh/config
          # Without the pin, the server must seal a random nonce under the feed link as
          # GitHub does: only the nonce goes to it, only the seal comes back.
          nonce=$(python3 -c 'import secrets; print(secrets.token_hex(32))')
          ours=$(python3 .github/scripts/feed_seal.py "$nonce") || ours=""
          unset AWIN_FEED_URL
          if [ "$pin" != "$expected" ]; then
            [ -n "$ours" ] || { echo "no feed link in GitHub's secrets: nothing can prove the server is ours"; exit 1; }
            # What any visitor of port 22 is told first: its SSH software and system.
            banner=$(timeout 10 bash -c 'exec 3<>"/dev/tcp/$1/22"; head -n 1 <&3' _ "$SERVER_HOST" 2>/dev/null \
              | tr -cd '[:print:]' | cut -c1-80 || true)
            echo "the server's SSH software says: ${banner:-nothing}"
            # The server's own words are never printed: its errors are only sorted.
            errors="$RUNNER_TEMP/seal-errors"
            theirs=$(ssh picwise "sudo -n python3 - $nonce" < .github/scripts/feed_seal.py 2> "$errors") && status=0 || status=$?
            if [ "$theirs" != "$ours" ]; then
              if grep -q 'Permission denied' "$errors"; then why="it did not let the deploy key in"
              elif grep -q 'Host key verification failed' "$errors"; then why="its host key changed again during the run"
              elif [ "$status" = 255 ]; then why="the login did not complete"
              elif grep -q 'sudo:' "$errors"; then why="the deploy key was let in, but sudo was refused"
              elif grep -q 'feed_seal: no feed link' "$errors"; then why="the deploy key was let in, but the server holds no feed link"
              elif [ "$status" = 0 ]; then why="the deploy key was let in, but its seal is not GitHub's (another feed link)"
              else why="the deploy key was let in, but sealing failed (exit $status)"
              fi
              rm -f "$errors"
              echo "the server could NOT prove it holds the feed link: $why; nothing is read"
              exit 1
            fi
            rm -f "$errors"
            echo "the server proved it holds the feed link: it is ours, with a new host key"
          fi
          # The host name resolves to the address, so it is masked like the address.
          names=$(ssh -n picwise 'hostname; hostname -f; hostname -I')
          for name in $names; do echo "::add-mask::$name"; done
          echo "connected"
      - name: Copy the server's prepared catalogue to the runner
        id: copy
        run: ssh -n picwise 'sudo cat /srv/picwise/shared/prepared/catalogue.json.gz' > "$RUNNER_TEMP/catalogue.json.gz"
      - name: Which kinds have products from too few shops, and which have none
        if: always() && steps.copy.outcome == 'success' && (env.MEASURE == 'gaps' || env.MEASURE == 'all')
        run: python3 deployment/server/print_gaps.py "$RUNNER_TEMP/catalogue.json.gz"
      - name: What a cap of 15% a category would keep
        if: always() && steps.copy.outcome == 'success' && env.MEASURE == 'all'
        run: python3 deployment/server/print_cap.py "$RUNNER_TEMP/catalogue.json.gz"
      - name: Prices at the ends, and far from their kind's
        if: always() && steps.copy.outcome == 'success' && env.MEASURE == 'all'
        run: python3 deployment/server/print_prices.py "$RUNNER_TEMP/catalogue.json.gz"
      - name: The kinds the rules of each earlier step read
        if: always() && steps.copy.outcome == 'success' && env.MEASURE == 'all'
        run: |
          : > "$RUNNER_TEMP/steps.txt"
          for commit in $RULES_STEPS; do
            git worktree add --detach --quiet "$RUNNER_TEMP/rules-$commit" "$commit"
            python3 deployment/server/kinds_of.py "$RUNNER_TEMP/rules-$commit" "$RUNNER_TEMP/catalogue.json.gz" "$RUNNER_TEMP/kinds-$commit.txt"
            printf -- '--step %s=%s\n' "${commit:0:7}" "$RUNNER_TEMP/kinds-$commit.txt" >> "$RUNNER_TEMP/steps.txt"
          done
      - name: The kinds this commit's rules read, each change on its own, and the far prices again with them
        if: always() && steps.copy.outcome == 'success' && env.MEASURE == 'all'
        run: |
          # One "--step NAME=FILE" per line, without spaces: split into words on purpose.
          # shellcheck disable=SC2046
          python3 deployment/server/print_kind_changes.py "$RUNNER_TEMP/catalogue.json.gz" $(cat "$RUNNER_TEMP/steps.txt")
      - name: Which words are general, and the choices a search for each could offer
        if: always() && steps.copy.outcome == 'success' && env.MEASURE == 'all'
        run: python3 deployment/server/print_choices.py "$RUNNER_TEMP/catalogue.json.gz"
      - name: What each rule of the choices changes, each on its own
        if: always() && steps.copy.outcome == 'success' && env.MEASURE == 'all'
        run: python3 deployment/server/print_choice_rules.py "$RUNNER_TEMP/catalogue.json.gz"
      - name: What a buyer would see for each general word, searched on the copy
        if: always() && steps.copy.outcome == 'success' && env.MEASURE == 'all'
        run: python3 deployment/server/print_search_choices.py "$RUNNER_TEMP/catalogue.json.gz"
      - name: Remove the key and the copy from the runner
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key ~/.ssh/config "$RUNNER_TEMP/catalogue.json.gz" "$RUNNER_TEMP/steps.txt"
          rm -rf "$RUNNER_TEMP"/rules-* "$RUNNER_TEMP"/kinds-*.txt
