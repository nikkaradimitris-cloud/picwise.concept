# The debugging's measure on the server's catalogue (owner, 2026-11-07: «ζητάω μία μεγάλη
# γενική απασφαλμάτωση»; the method's steps 2 and 3 and about $3 for them, «Ναι σε όλα»; not
# every product, «Κατάλαβα τη διευκρίνιση δεν χρειάζεται να τα ελέγξουμε όλα»; the rules
# built that day deployed after it, «Ανέβασε μετά τη μέτρηση..»). GitHub's runner copies the
# server's prepared catalogue, and the gone photos and offers the site reads, as the AI
# measure does (ai-measure.yml, the same steps), and runs deployment/server/audit_search.py:
# the searches of the measure; their first 12 cards with this commit's code and with the
# rules deployed (COMPARE_WITH, in a worktree, as server-confusions.yml reads the rules
# before); then Claude Haiku 5.5 asked, 40 products a call, whether the products each kind
# holds (those the reports flag and a sample of the rest), 10,000 products with no kind, and
# every card are what was asked for; printed per category, for both sets of rules. Nothing on
# the server or shown changes, and nothing is deployed. The SDK is installed from
# deployment/server/requirements-ai.txt, every package checked against its hash; the key is
# ANTHROPIC_API_KEY, never printed; the calls stop at the budget below. The repository is
# public and so is this log: the server's names and addresses are masked, and the measure
# prints counts, kinds, titles, brands, shops and prices, never a link.
# A run is one commit that changes only `if: false` to `if: true`, pushed to the working
# branch, then one that turns it off again and records the run here.
# Run 42390049201 (2026-11-07, this file at c7110cc against 75fd3d0; the server's catalogue
# prepared at 04:25 that day, 597,270 products a card can show): 1,338 searches (807 names,
# 265 brands, 266 read as another kind offline), 2 h 18 min, the AI $0.80 of the $3 (1,845
# calls, 34 with no answer). A search took 1.96 s in the middle with this commit and 1.95 s
# with the rules deployed, but 4,172 s in all against 2,797 s. Of the first 12 cards judged,
# right: 73.2% against 65.0%; absurd 778 against 1,233; right cards 7,438 against 7,627;
# searches with no card 258 (143 asking "Did you mean") against 125. Worse in CL (absurd 52
# against 12), TY (12 against 0) and FU (40 against 35), and GA and CO hold fewer right
# cards: nothing deployed. Of 10,000 products with no kind, the AI read 2,873 as rings.
name: Search audit (read-only, measured only)
on:
  push:
    branches: [ccr-4f47068a-99ikwe]
    paths:
      - '.github/workflows/search-audit.yml'
permissions:
  contents: read
# Shared with the deployment, the setup and the shops' round, so the files are never
# copied while one of them writes them.
concurrency:
  group: server-setup
  cancel-in-progress: false
jobs:
  audit:
    if: true
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      # At most $3 in all for the debugging's measure: run 42390049201 spent $0.80.
      BUDGET: '1.00'
      # The rules the site runs now: the AI layer's deployment, 2026-11-06.
      COMPARE_WITH: 75fd3d0
      # The cards alone: the products of each kind and the gaps do not change with the
      # search's rules, and run 42390049201 asked about them. Empty to ask again.
      CARDS_ONLY: '--cards-only'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # The commit of COMPARE_WITH, for its worktree.
          fetch-depth: 0
      - name: Connect with the key, check the server's identity, mask its names
        id: connect
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          AWIN_FEED_URL: ${{ secrets.AWIN_FEED_URL }}
        run: |
          install -m 700 -d ~/.ssh
          # A key pasted on Windows may carry carriage returns, which ssh refuses.
          printf '%s\n' "$SERVER_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The server must show a login the host key pinned in .github/server-host-key.pin
          # (an HMAC under the deploy key: .github/scripts/host_key_pin.py), or prove below
          # that it holds the feed link; every connection accepts the key it showed only.
          # The key is the one a login's first step is shown: an ssh client offering no
          # key or password writes it down, and the login ends there.
          seen="$RUNNER_TEMP/seen"
          : > "$seen"
          ssh -F /dev/null -o BatchMode=yes -o ConnectTimeout=15 -o HostKeyAlgorithms=ssh-ed25519 \
            -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$seen" -o GlobalKnownHostsFile=/dev/null \
            -o PubkeyAuthentication=no -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no \
            -o HostbasedAuthentication=no -o GSSAPIAuthentication=no -o LogLevel=QUIET \
            "ubuntu@$SERVER_HOST" true 2>/dev/null || true
          host_key=$(awk 'NF >= 3 {print $2, $3; exit}' "$seen")
          rm -f "$seen"
          [ -n "$host_key" ] || { echo "the server showed a login no host key"; exit 1; }
          pin=$(HOST_KEY="$host_key" python3 .github/scripts/host_key_pin.py)
          expected=$( (grep -v '^#' .github/server-host-key.pin || true) | tr -d '[:space:]')
          if [ "$pin" = "$expected" ]; then
            echo "the server matches the pin"
            echo "pinned=yes" >> "$GITHUB_OUTPUT"
          else
            echo "the server does NOT match the pin (reinstalled, or not our server); its pin: $pin"
            echo "pinned=no" >> "$GITHUB_OUTPUT"
          fi
          # What a key scan is shown, only to report it.
          scanned=$(ssh-keyscan -T 15 -t ed25519 "$SERVER_HOST" 2>/dev/null | awk 'NF >= 3 {print $2, $3; exit}')
          scan_pin=""
          if [ -n "$scanned" ]; then scan_pin=$(HOST_KEY="$scanned" python3 .github/scripts/host_key_pin.py); fi
          if [ "$scan_pin" = "$pin" ]; then
            echo "a key scan is shown the same key"
            echo "scan_differs=no" >> "$GITHUB_OUTPUT"
          else
            echo "a key scan is shown another key (pin ${scan_pin:-none})"
            echo "scan_differs=yes" >> "$GITHUB_OUTPUT"
            echo "scan_pin=$scan_pin" >> "$GITHUB_OUTPUT"
          fi
          echo "picwise-server $host_key" > ~/.ssh/known_hosts_picwise
          # The user is OVHcloud's for Ubuntu, written here rather than read from the
          # SERVER_USER secret: GitHub masks a secret's value all over the log.
          cat > ~/.ssh/config <<EOF
          Host picwise
            HostName $SERVER_HOST
            HostKeyAlias picwise-server
            UserKnownHostsFile ~/.ssh/known_hosts_picwise
            StrictHostKeyChecking yes
            User ubuntu
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 8
            LogLevel ERROR
          EOF
          chmod 600 ~/.ssh/config
          # Without the pin, the server must seal a random nonce under the feed link as
          # GitHub does: only the nonce goes to it, only the seal comes back.
          nonce=$(python3 -c 'import secrets; print(secrets.token_hex(32))')
          ours=$(python3 .github/scripts/feed_seal.py "$nonce") || ours=""
          unset AWIN_FEED_URL
          if [ "$pin" != "$expected" ]; then
            [ -n "$ours" ] || { echo "no feed link in GitHub's secrets: nothing can prove the server is ours"; exit 1; }
            # What any visitor of port 22 is told first: its SSH software and system.
            banner=$(timeout 10 bash -c 'exec 3<>"/dev/tcp/$1/22"; head -n 1 <&3' _ "$SERVER_HOST" 2>/dev/null \
              | tr -cd '[:print:]' | cut -c1-80 || true)
            echo "the server's SSH software says: ${banner:-nothing}"
            # The server's own words are never printed: its errors are only sorted.
            errors="$RUNNER_TEMP/seal-errors"
            theirs=$(ssh picwise "sudo -n python3 - $nonce" < .github/scripts/feed_seal.py 2> "$errors") && status=0 || status=$?
            if [ "$theirs" != "$ours" ]; then
              if grep -q 'Permission denied' "$errors"; then why="it did not let the deploy key in"
              elif grep -q 'Host key verification failed' "$errors"; then why="its host key changed again during the run"
              elif [ "$status" = 255 ]; then why="the login did not complete"
              elif grep -q 'sudo:' "$errors"; then why="the deploy key was let in, but sudo was refused"
              elif grep -q 'feed_seal: no feed link' "$errors"; then why="the deploy key was let in, but the server holds no feed link"
              elif [ "$status" = 0 ]; then why="the deploy key was let in, but its seal is not GitHub's (another feed link)"
              else why="the deploy key was let in, but sealing failed (exit $status)"
              fi
              rm -f "$errors"
              echo "the server could NOT prove it holds the feed link: $why; nothing is read"
              exit 1
            fi
            rm -f "$errors"
            echo "the server proved it holds the feed link: it is ours, with a new host key"
          fi
          # The host name resolves to the address, so it is masked like the address.
          names=$(ssh -n picwise 'hostname; hostname -f; hostname -I')
          for name in $names; do echo "::add-mask::$name"; done
          echo "connected"
      - name: Copy the server's prepared catalogue, gone photos and offers to the runner
        id: copy
        run: |
          ssh -n picwise 'sudo cat /srv/picwise/shared/prepared/catalogue.json.gz' > "$RUNNER_TEMP/catalogue.json.gz"
          echo "the catalogue: $(( $(stat -c %s "$RUNNER_TEMP/catalogue.json.gz") / 1048576 )) MB"
          # As the site reads them: the photos the nightly check found gone, the offers fetched.
          ssh -n picwise 'sudo cat /srv/picwise/shared/photos/gone.json' > "$RUNNER_TEMP/gone.json" \
            || echo "no gone photos on the server: the copy shows every product"
          ssh -n picwise 'sudo cat /srv/picwise/shared/offers/offers.json' > "$RUNNER_TEMP/offers.json" \
            || echo "no offers on the server: the copy puts no product on offer"
      # The server's Python (Ubuntu 24.04), for which requirements-ai.txt is compiled.
      - uses: actions/setup-python@v5
        if: always() && steps.copy.outcome == 'success'
        with:
          python-version: '3.12'
      - name: Install the SDK, every package checked against its hash
        if: always() && steps.copy.outcome == 'success'
        run: |
          python -m venv "$RUNNER_TEMP/ai"
          "$RUNNER_TEMP/ai/bin/pip" install -q --disable-pip-version-check --no-cache-dir --require-hashes \
            -r deployment/server/requirements-ai.txt
          "$RUNNER_TEMP/ai/bin/python" -c "import anthropic, sys; print('anthropic', anthropic.__version__, 'on Python', sys.version.split()[0])"
      - name: The searches of the measure
        if: always() && steps.copy.outcome == 'success'
        run: |
          python deployment/server/audit_search.py searches "$RUNNER_TEMP/catalogue.json.gz" "$RUNNER_TEMP/searches.json"
      - name: Their first 12 cards with this commit's code
        if: always() && steps.copy.outcome == 'success'
        run: |
          python deployment/server/audit_search.py cards "$RUNNER_TEMP/catalogue.json.gz" "$RUNNER_TEMP/searches.json" \
            "$RUNNER_TEMP/cards.json" --gone "$RUNNER_TEMP/gone.json" --offers "$RUNNER_TEMP/offers.json"
      - name: Their first 12 cards with the rules deployed
        if: always() && steps.copy.outcome == 'success'
        run: |
          git worktree add --detach --quiet "$RUNNER_TEMP/rules-before" "$COMPARE_WITH"
          python deployment/server/audit_search.py cards "$RUNNER_TEMP/catalogue.json.gz" "$RUNNER_TEMP/searches.json" \
            "$RUNNER_TEMP/cards-before.json" --src "$RUNNER_TEMP/rules-before" \
            --gone "$RUNNER_TEMP/gone.json" --offers "$RUNNER_TEMP/offers.json"
      - name: What the AI says of the products and the cards
        if: always() && steps.copy.outcome == 'success'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          "$RUNNER_TEMP/ai/bin/python" deployment/server/audit_search.py judge "$RUNNER_TEMP/catalogue.json.gz" \
            "$RUNNER_TEMP/searches.json" "$RUNNER_TEMP/cards.json" --before "$RUNNER_TEMP/cards-before.json" \
            --before-name "$COMPARE_WITH" --budget "$BUDGET" $CARDS_ONLY
      - name: Remove the key and the copies from the runner
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key ~/.ssh/config "$RUNNER_TEMP/catalogue.json.gz"
          rm -f "$RUNNER_TEMP/gone.json" "$RUNNER_TEMP/offers.json" "$RUNNER_TEMP/searches.json"
          rm -f "$RUNNER_TEMP/cards.json" "$RUNNER_TEMP/cards-before.json"
          rm -rf "$RUNNER_TEMP/rules-before"
