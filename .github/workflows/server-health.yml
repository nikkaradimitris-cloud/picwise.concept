# A read-only look at the server every morning, for the daily session's report (owner,
# 2026-11-16, choosing among the proposals for the daily work: «Έλεγχος προσφορών,
# ταχύτητας και πόρων», with «Εβδομαδιαία σύνοψη Κυριακής» and «Ήσυχες μέρες: μία
# γραμμή»; docs/PICWISE_DAILY_WORK.md says what the session does with it).
#
# A Claude session cannot open SSH to the server, and the offers, the photos' check, the
# night's preparation and the server's memory and disk are seen only there; GitHub's
# runners can reach it. The daily session (11:43 in Athens) starts it by hand at its
# start and reads it (docs/PICWISE_DAILY_WORK.md): the schedule, 08:07 UTC, was started by
# GitHub 9 to 10 hours late on 16, 17 and 18/11, after the session; it stays as a second
# look in the evening, and the only one on a day whose session does not run. It changes
# nothing on the server: deployment/server/print_health.py reads the site's service, the
# night's preparation, the offers, the photos, the AI's spend, the memory and the disk,
# and says which limit is passed; deployment/server/count_searches.py counts the visitors'
# searches, and on Sundays asks the site on the server itself, once each, the week's
# different searches, to count those that found no product (no visitor's search, no
# cost: the site keeps and sends to the AI only what a page's own script asks). From
# outside, how fast the site answers four searches. The repository is public and so is
# this log: the server's names and address are masked, the visitors' searches are only
# counted, never printed, and no shop's link is opened.
name: Server health (read-only)
on:
  schedule:
    - cron: '7 8 * * *'
  workflow_dispatch:
    inputs:
      weekly:
        description: "Also count the week's searches that found no product (Sundays do)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: server-health
  cancel-in-progress: false
jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: How fast the site answers, from outside
        run: |
          # Each page's first byte, and of it the part after the secure connection was made:
          # the server's own time and one trip across the network. A page whose part is over
          # 1 s is asked once more, so that one slow moment is told apart from a slow site.
          measure() {
            curl -s -o /dev/null -w '%{http_code} %{time_appconnect} %{time_starttransfer}' --max-time 20 "https://picwise.subby.cloud$1" || true
          }
          seconds() { awk -v a="${1:-0}" -v b="${2:-0}" 'BEGIN {printf "%.2f", a - b}'; }
          for path in /health '/search?q=kettle' '/search?q=hoodie' '/search?q=laptop' '/search?q=sofa'; do
            read -r code tls first <<< "$(measure "$path")"
            server=$(seconds "$first" "$tls")
            line="status ${code:-000}, first byte $(seconds "$first" 0) s, the server's part ${server} s: $path"
            if awk -v s="$server" 'BEGIN {exit !(s > 1.0)}'; then
              read -r code tls first <<< "$(measure "$path")"
              line="$line; asked again: status ${code:-000}, the server's part $(seconds "$first" "$tls") s"
            fi
            echo "$line"
          done
      - name: Connect with the key, check the server's identity, mask its names
        id: connect
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          # A key pasted on Windows may carry carriage returns, which ssh refuses.
          printf '%s\n' "$SERVER_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # As server-deploy.yml: the server must show a login the host key pinned in
          # .github/server-host-key.pin, and every connection below accepts that key only.
          seen="$RUNNER_TEMP/seen"
          : > "$seen"
          ssh -F /dev/null -o BatchMode=yes -o ConnectTimeout=15 -o HostKeyAlgorithms=ssh-ed25519 \
            -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$seen" -o GlobalKnownHostsFile=/dev/null \
            -o PubkeyAuthentication=no -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no \
            -o HostbasedAuthentication=no -o GSSAPIAuthentication=no -o LogLevel=QUIET \
            "ubuntu@$SERVER_HOST" true 2>/dev/null || true
          host_key=$(awk 'NF >= 3 {print $2, $3; exit}' "$seen")
          rm -f "$seen"
          [ -n "$host_key" ] || { echo "the server showed a login no host key"; exit 1; }
          pin=$(HOST_KEY="$host_key" python3 .github/scripts/host_key_pin.py)
          expected=$( (grep -v '^#' .github/server-host-key.pin || true) | tr -d '[:space:]')
          if [ "$pin" != "$expected" ]; then
            echo "the server does NOT match the pin (reinstalled, or not our server); its pin: $pin"
            exit 1
          fi
          echo "the server matches the pin"
          echo "picwise-server $host_key" > ~/.ssh/known_hosts_picwise
          cat > ~/.ssh/config <<EOF
          Host picwise
            HostName $SERVER_HOST
            HostKeyAlias picwise-server
            UserKnownHostsFile ~/.ssh/known_hosts_picwise
            StrictHostKeyChecking yes
            User ubuntu
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 8
            LogLevel ERROR
          EOF
          chmod 600 ~/.ssh/config
          # The host name resolves to the address, so it is masked like the address.
          names=$(ssh -n picwise 'hostname; hostname -f; hostname -I')
          for name in $names; do echo "::add-mask::$name"; done
          echo "connected"
      - name: What runs on the server, and which limit is passed
        if: always() && steps.connect.outcome == 'success'
        # deployment/server/print_health.py, this commit's, read by the server's python3 from
        # the standard input: it only reads, and ends with each limit passed, or none.
        run: ssh picwise 'sudo python3 -' < deployment/server/print_health.py
      - name: The visitors' searches, counted
        if: always() && steps.connect.outcome == 'success'
        env:
          WEEKLY: ${{ inputs.weekly }}
        run: |
          # Numbers only: the words stay on the server (deployment/server/count_searches.py).
          # On Sundays, for the week's summary, each different search of the week is asked
          # again of the site on the server itself, to count those that found no product.
          check=""
          if [ "$(date -u +%u)" = 7 ] || [ "$WEEKLY" = "true" ]; then check="--check"; fi
          ssh picwise "sudo python3 - $check" < deployment/server/count_searches.py
      - name: What the AI decided about the shops' listings
        if: always() && steps.connect.outcome == 'success'
        # One card per product (owner, 2026-11-19): the sets answered and a sample of what was
        # joined and kept apart, titles only, to be checked (deployment/server/print_families.py).
        run: |
          ssh -n picwise 'sudo cat /srv/picwise/assist/families/answers/sets.json 2> /dev/null || true' \
            | python3 deployment/server/print_families.py --sample 60
      - name: Remove the key from the runner
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/config
