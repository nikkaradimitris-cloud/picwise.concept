# Checks that the Anthropic API key in GitHub's secrets (ANTHROPIC_API_KEY) works, then
# sends the AI layer's requests end to end: the requests it builds, through the SDK
# installed from deployment/server/requirements-ai.txt with every hash, read by its own
# code (deployment/server/ai_preflight.py, fictional products). Five calls of a few
# thousand tokens, well under a cent; nothing on the server or the site touched
# (the AI layer's spec, docs/PICWISE_AI_LAYER_SPEC.md, 4.6 and 4.8).
# The key is never printed (GitHub masks it as well); only whether it is there, the
# answers' status, the model that answered and the tokens it counted.
# To check again: change this file and push it alone.
# Checked: 2026-11-05, the key (run 42105499951); then with the layer's request (run
# 42111149372); then the layer's answer with descriptions and the shops' words (run
# 42116311350); then each yes with the product's own words that show it (run
# 42122881328); then, on 2026-11-06, the rules the third measure called for: a product of
# another kind, "all skin types", a stated age, the words in pieces.
name: ai-key-check
on:
  push:
    branches: [ccr-4f47068a-99ikwe]
    paths:
      - '.github/workflows/ai-key-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ask Claude Haiku 5.5 for one word
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "The secret ANTHROPIC_API_KEY is missing or empty."
            exit 1
          fi
          case "$ANTHROPIC_API_KEY" in
            sk-ant-*) shape="starts as an Anthropic API key does" ;;
            *) shape="does NOT start as an Anthropic API key does (sk-ant-)" ;;
          esac
          echo "The secret is there: ${#ANTHROPIC_API_KEY} characters; it $shape."
          status=$(curl -sS -o answer.json -w '%{http_code}' https://api.anthropic.com/v1/messages \
            -H "Authorization: Bearer $ANTHROPIC_API_KEY" \
            -H "anthropic-version: 2026-10-21" \
            -H "content-type: application/json" \
            -d '{"model": "claude-haiku-5-5", "max_tokens": 200, "output_config": {"effort": "low"}, "messages": [{"role": "user", "content": "Reply with the single word: ready"}]}')
          echo "HTTP status: $status"
          python3 - <<'EOF'
          import json
          answer = json.load(open("answer.json", encoding="utf-8"))
          if answer.get("type") == "error":
              error = answer.get("error") or {}
              print("Anthropic answered with an error:", error.get("type"), "-", error.get("message"))
              raise SystemExit(1)
          text = "".join(block.get("text", "") for block in answer.get("content", []) if block.get("type") == "text")
          print("Model:", answer.get("model"))
          print("Answer:", text.strip() or "(no text)")
          print("Stop reason:", answer.get("stop_reason"))
          usage = answer.get("usage") or {}
          print("Tokens: in", usage.get("input_tokens"), "| out", usage.get("output_tokens"))
          EOF
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # The server's Python (Ubuntu 24.04), for which requirements-ai.txt is compiled.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the SDK, every package checked against its hash
        run: |
          python -m venv "$RUNNER_TEMP/ai"
          "$RUNNER_TEMP/ai/bin/pip" install -q --disable-pip-version-check --no-cache-dir --require-hashes \
            -r deployment/server/requirements-ai.txt
          "$RUNNER_TEMP/ai/bin/python" -c "import anthropic, sys; print('anthropic', anthropic.__version__, 'on Python', sys.version.split()[0])"
      - name: Four requests of the AI layer, end to end
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          "$RUNNER_TEMP/ai/bin/python" deployment/server/ai_preflight.py
