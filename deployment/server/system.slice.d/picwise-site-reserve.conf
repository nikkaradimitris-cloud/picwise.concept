# The site's reserve (the checks' rules 23; owner, 2026-11-26: «Δεσμευμένη μνήμη για το site, ώστε να
# μην του τη στερούν ποτέ τα bot»): a unit's protected memory (picwise-web.service's MemoryMin) holds
# only as far as its parent slice's does, so system.slice protects as much. The bots are not in it
# (picwisebots.slice). Installed by deployment/server/deploy.sh as
# /etc/systemd/system/system.slice.d/picwise-site-reserve.conf.
[Slice]
MemoryMin=6G
